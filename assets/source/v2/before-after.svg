<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">A rough request becomes a clearer, unsent draft</title><desc id="desc">Illustration, not a product screenshot. Rough draft: fix the login loop on safari, dont touch the api --clarify Rewritten draft: Fix the login redirect loop that happens in Safari. Do not change the API. Before editing, find where the redirect is triggered and explain the cause. The rewritten draft remains unsent; press Enter to send.</desc>
<style>text { font-variant-ligatures: none; }</style>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#F4F4EB" /><rect x="16" y="16" width="1568" height="868" rx="28" fill="none" stroke="#CDD6CA" stroke-width="2"/><text x="64" y="76" font-family="Fira Code" font-size="20" font-weight="400" fill="#53695F" letter-spacing="1.2">THE PROMPT STAYS WITH YOU</text><text x="1536" y="76" font-family="Fira Code" font-size="20" font-weight="400" fill="#53695F" text-anchor="end">ILLUSTRATED FLOW</text><text x="60" y="153" font-family="Lato" font-size="64" font-weight="700" fill="#16342D" >A rewrite. Not a send.</text><text x="64" y="204" font-family="Lato" font-size="27" font-weight="400" fill="#53695F" >The same prompt box, before and after clarify.</text><rect x="64" y="257" width="42" height="32" rx="8" fill="none" stroke="#CDD6CA" stroke-width="1.5"/><text x="85" y="280" font-family="Fira Code" font-size="17" font-weight="400" fill="#53695F" text-anchor="middle">01</text><text x="122" y="280" font-family="Fira Code" font-size="19" font-weight="500" fill="#16342D" letter-spacing="0.5">ROUGH REQUEST</text><rect x="64" y="314" width="650" height="376" rx="22" fill="#16342D" /><text x="98" y="353" font-family="Fira Code" font-size="20" font-weight="400" fill="#BDE8CE" letter-spacing="0.8">PROMPT BOX</text><path d="M98 377H680" stroke="#3A574B" stroke-width="1" /><text x="678" y="353" font-family="Fira Code" font-size="18" font-weight="400" fill="#95B8A7" text-anchor="end">draft</text><rect x="886" y="257" width="42" height="32" rx="8" fill="none" stroke="#CDD6CA" stroke-width="1.5"/><text x="907" y="280" font-family="Fira Code" font-size="17" font-weight="400" fill="#53695F" text-anchor="middle">02</text><text x="944" y="280" font-family="Fira Code" font-size="19" font-weight="500" fill="#16342D" letter-spacing="0.5">CLEARER DRAFT</text><rect x="886" y="314" width="650" height="376" rx="22" fill="#16342D" /><text x="920" y="353" font-family="Fira Code" font-size="20" font-weight="400" fill="#BDE8CE" letter-spacing="0.8">PROMPT BOX</text><path d="M920 377H1502" stroke="#3A574B" stroke-width="1" /><text x="1500" y="353" font-family="Fira Code" font-size="18" font-weight="400" fill="#95B8A7" text-anchor="end">draft</text><rect x="1404" y="255" width="132" height="34" rx="17" fill="#DCEBDD" /><text x="1470" y="279" font-family="Fira Code" font-size="20" font-weight="500" fill="#16342D" text-anchor="middle">UNSENT</text><text x="98" y="430" font-family="Fira Code" font-size="28" fill="#F4F4EB" data-copy="rough"><tspan x="98" y="430">fix the login loop on safari, </tspan><tspan x="98" y="470">dont touch the api <tspan fill="#BDE8CE">--clarify</tspan></tspan></text><text x="920" y="430" font-family="Fira Code" font-size="28" fill="#F4F4EB" data-copy="clear"><tspan x="920" y="430">Fix the login redirect loop that </tspan><tspan x="920" y="470">happens in Safari. Do not change </tspan><tspan x="920" y="510">the API. Before editing, find </tspan><tspan x="920" y="550">where the redirect is triggered </tspan><tspan x="920" y="590">and explain the cause.</tspan></text><rect x="1299" y="566" width="3" height="28" rx="1" fill="#BDE8CE" /><text x="98" y="657" font-family="Fira Code" font-size="20" font-weight="400" fill="#AACAB9" >trailing flag requests a rewrite</text><text x="920" y="657" font-family="Fira Code" font-size="20" font-weight="400" fill="#BDE8CE" >press Enter to send</text><text x="800" y="468" font-family="Fira Code" font-size="20" font-weight="500" fill="#16342D" text-anchor="middle">clarify</text><path d="M746 502H852" stroke="#53695F" stroke-width="2.5" /><path d="M841 492L853 502L841 512" fill="none" stroke="#53695F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="540" font-family="Fira Code" font-size="18" font-weight="400" fill="#53695F" text-anchor="middle">in place</text><path d="M64 754H1536" stroke="#CDD6CA" stroke-width="1" /><text x="64" y="817" font-family="Lato" font-size="32" font-weight="700" fill="#16342D" >You decide what gets sent.</text><text x="1536" y="817" font-family="Lato" font-size="25" font-weight="400" fill="#53695F" text-anchor="end">Read it. Edit it. Then press Enter.</text>
</svg>